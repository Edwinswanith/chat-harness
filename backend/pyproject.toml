[project]
name = "simple-ai-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.104,<1", "uvicorn>=0.23,<1", "httpx>=0.24,<1", "pydantic>=2,<3", "python-multipart>=0.0.9,<1", "google-genai>=1.0,<2", "pypdf>=5,<7", "pymongo[srv]>=4.10,<5", "boto3>=1.35,<2", "playwright>=1.48,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
